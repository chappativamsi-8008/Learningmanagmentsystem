{% extends "base.html" %} {% load static %} {% block content %}

<link rel="stylesheet" href="{% static 'css/courses.css' %}" />

<div class="lesson-delete-page">
  <div class="form-container">
    <div class="delete-icon">!</div>

    <h1>Delete Lesson?</h1>

    <p class="delete-description">
      Are you sure you want to delete this lesson?
    </p>

    <h3 class="lesson-name">{{ lesson.title }}</h3>

    <p class="module-name">Module: <strong>{{ module.title }}</strong></p>

    <form method="POST">
      {% csrf_token %}

      <div class="delete-actions">
        <button type="submit" class="delete-confirm">Yes, Delete</button>

        <a href="{% url 'teacher_courses' %}" class="delete-cancel"> Cancel </a>
      </div>
    </form>
  </div>
</div>

{% endblock %} ```
