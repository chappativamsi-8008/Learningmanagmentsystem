{% extends "base.html" %} {% load static %} {% block content %}

<link rel="stylesheet" href="{% static 'css/courses.css' %}" />

<div class="lesson-form-container">
  <div class="lesson-form-card">
    <h1>Add Lesson</h1>

    <p>
      Add learning content to
      <strong>{{ module.title }}</strong>
    </p>

    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="title"> Lesson Title </label>

        <input
          type="text"
          id="title"
          name="title"
          placeholder="Enter lesson title"
          required
        />
      </div>

      <div class="form-group">
        <label for="description"> Description </label>

        <textarea
          id="description"
          name="description"
          rows="4"
          placeholder="Enter lesson description"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="matter_link"> Matter / Notes Link </label>

        <input
          type="url"
          id="matter_link"
          name="matter_link"
          placeholder="https://example.com/notes"
        />
      </div>

      <div class="form-group">
        <label for="video_link"> Video Link </label>

        <input
          type="url"
          id="video_link"
          name="video_link"
          placeholder="https://youtube.com/..."
        />
      </div>

      <div class="form-group">
        <label for="order"> Lesson Order </label>

        <input
          type="number"
          id="order"
          name="order"
          value="1"
          min="1"
          required
        />
      </div>

      <div class="lesson-form-actions">
        <button type="submit" class="save-lesson-btn">Create Lesson</button>

        <a href="{% url 'teacher_courses' %}" class="cancel-lesson-btn">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
