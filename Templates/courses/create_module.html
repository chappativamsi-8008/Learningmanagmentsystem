{% extends "base.html" %} {% load static %} {% block content %}
<link rel="stylesheet" href="{% static 'css/courses.css' %}" />

<div class="module-form">
  <h1>Create Module</h1>

  <p class="module-course">
    Course:
    <strong>{{ course.title }}</strong>
  </p>

  <form method="POST">
    {% csrf_token %}

    <!-- Module Title -->

    <div class="form-group">
      <label for="{{ form.title.id_for_label }}"> Module Title </label>

      {{ form.title }} {{ form.title.errors }}
    </div>

    <!-- Description -->

    <div class="form-group">
      <label for="{{ form.description.id_for_label }}"> Description </label>

      {{ form.description }} {{ form.description.errors }}
    </div>

    <!-- Order -->

    <div class="form-group">
      <label for="{{ form.order.id_for_label }}"> Module Order </label>

      {{ form.order }} {{ form.order.errors }}
    </div>

    <button type="submit" class="btn-primary">Create Module</button>
  </form>
</div>

{% endblock %}
