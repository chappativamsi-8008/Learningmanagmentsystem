{% extends "base.html" %} {% load static %} {% block content %}

<div class="edit-lesson-page">
  <div class="form-container">
    <h1>Edit Lesson</h1>

    <p class="lesson-context">
      Course: <strong>{{ module.course.title }}</strong>
    </p>

    <p class="lesson-context">Module: <strong>{{ module.title }}</strong></p>

    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="lesson-title">Lesson Title</label>
        <input
          type="text"
          id="lesson-title"
          name="title"
          value="{{ lesson.title }}"
          required
        />
      </div>

      <div class="form-group">
        <label for="lesson-description">Description</label>
        <textarea id="lesson-description" name="description" rows="5">
{{ lesson.description }}</textarea
        >
      </div>

      <div class="form-group">
        <label for="lesson-matter-link">Matter Link</label>
        <input
          type="url"
          id="lesson-matter-link"
          name="matter_link"
          value="{{ lesson.matter_link }}"
        />
      </div>

      <div class="form-group">
        <label for="lesson-video-link">Video Link</label>
        <input
          type="url"
          id="lesson-video-link"
          name="video_link"
          value="{{ lesson.video_link }}"
        />
      </div>

      <div class="form-group">
        <label for="lesson-order">Lesson Order</label>
        <input
          type="number"
          id="lesson-order"
          name="order"
          value="{{ lesson.order }}"
          min="1"
          required
        />
      </div>

      <div class="lesson-edit-actions">
        <button type="submit" class="update-lesson-btn">Update Lesson</button>

        <a href="{% url 'teacher_courses' %}" class="cancel-lesson-btn">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %} ```
